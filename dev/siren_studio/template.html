<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siren Studio</title>
<style>
  :root {
    --bg: #111418; --panel: #1a1f25; --panel2: #222932; --line: #2f3843; --fg: #e6eaef; --dim: #8d99a6;
    --accent: #4ea1ff; --red: #ff4b3a; --blue: #3a6bff; --amber: #ffb03a; --green: #4cd18a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #status { color: var(--dim); font-size: 12px; }
  #status.err { color: var(--red); }
  .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.small { padding: 2px 7px; font-size: 12px; }
  button:disabled { opacity: 0.4; cursor: default; }
  input, select, textarea { background: #0d1014; color: var(--fg); border: 1px solid var(--line); border-radius: 5px; font: inherit; padding: 3px 6px; }
  input[type=number] { width: 78px; }
  input[type=range] { flex: 1; min-width: 80px; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
  main { display: grid; grid-template-columns: 360px 1fr; gap: 14px; padding: 14px 16px 40px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  section h2 { font-size: 13px; margin: 0 0 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  section h3 { font-size: 12px; margin: 14px 0 6px; color: var(--dim); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .row > label:first-child { width: 128px; flex: none; color: var(--dim); }
  .row .unit { color: var(--dim); width: 34px; font-size: 12px; }
  #globals .row > label:first-child { width: 112px; }
  #globals input[type=number] { width: 64px; }
  .hint { color: var(--dim); font-size: 12px; margin: 4px 0 8px; }
  .tones { display: flex; flex-direction: column; gap: 4px; }
  .tone { display: flex; justify-content: space-between; align-items: center; padding: 6px 9px; border-radius: 6px; background: var(--panel2); border: 1px solid transparent; cursor: pointer; }
  .tone.sel { border-color: var(--accent); }
  .tone .id { color: var(--dim); font-size: 11px; font-family: ui-monospace, Consolas, monospace; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
  @media (max-width: 1200px) { .grid2 { grid-template-columns: 1fr; } }
  canvas { width: 100%; display: block; background: #0d1014; border: 1px solid var(--line); border-radius: 8px; }
  #pattern { height: 240px; cursor: crosshair; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  th, td { padding: 3px 5px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  td input[type=number] { width: 74px; }
  .note { font-family: ui-monospace, Consolas, monospace; color: var(--amber); }
  .harm { display: flex; gap: 4px; align-items: flex-end; height: 140px; margin-bottom: 6px; }
  .harm div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; }
  .harm input[type=range] { writing-mode: vertical-lr; direction: rtl; flex: 1 1 0; min-height: 0; height: calc(100% - 20px); width: 18px; min-width: 0; }
  .harm span { font-size: 11px; color: var(--dim); }
  .cycle { display: flex; flex-direction: column; gap: 3px; }
  .cycle div { display: flex; align-items: center; gap: 6px; }
  .cycle div label { flex: 1; }
  textarea { width: 100%; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .lights { display: inline-flex; gap: 4px; margin-left: 4px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; background: #333; display: inline-block; }
  .lights.c2 i:first-child { animation: blink 1.2s steps(1) infinite; background: var(--red); }
  .lights.c2 i:last-child { animation: blink 1.2s steps(1) infinite 0.6s; background: var(--blue); }
  .lights.c3 i:first-child { animation: blink 0.25s steps(1) infinite; background: var(--red); }
  .lights.c3 i:last-child { animation: blink 0.25s steps(1) infinite 0.125s; background: var(--blue); }
  @keyframes blink { 50% { opacity: 0.15; } }
  kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; }
  #sounding { font-weight: 600; min-width: 90px; color: var(--green); }
</style>
</head>
<body>
<header>
  <h1>Siren Studio</h1>
  <div class="bar">
    <button id="play">▶ Play selected</button>
    <button id="stop">■ Stop</button>
    <label class="bar" style="gap:4px;color:var(--dim)">Monitor <input id="monitor" type="range" min="0" max="1" step="0.01" value="0.5" style="width:90px"></label>
  </div>
  <div class="sep"></div>
  <div class="bar" title="Plays the siren the way the game will: the light mode picks the tone, the tone key steps through the cycle">
    <span style="color:var(--dim)">In-game test:</span>
    <button id="simLights">Lights: off</button><span class="lights" id="lightDots"><i></i><i></i></span>
    <button id="simTone">Tone key</button>
    <button id="passBy" title="A car with this siren driving past you 4 m away (pitch as in game; loudness only roughly)">Drive past</button>
    <input id="passSpeed" type="number" value="80" min="10" max="250" step="10" style="width:60px" title="km/h"><span style="color:var(--dim)">km/h</span>
    <label class="bar" style="gap:4px;color:var(--dim)" title="Hear it as the driver and passengers do: muffled and quieter (In game: Inside the car)"><input id="inside" type="checkbox"> Inside the car</label>
    <span id="sounding">silent</span>
  </div>
  <span id="status">Loading the synth…</span>
</header>

<main>
  <div>
    <section>
      <h2>Tones <span class="bar"><button class="small" id="addTone">New</button><button class="small" id="dupTone">Duplicate</button><button class="small" id="delTone">Delete</button></span></h2>
      <div class="tones" id="toneList"></div>
    </section>
    <section>
      <h2>In game</h2>
      <div id="globals"></div>
    </section>
    <section>
      <h2>Pass it back</h2>
      <p class="hint">Copy the settings file and paste it to Claude: it replaces <code>lua/police_siren/sh_siren_config.lua</code>. Your edits are also kept in this browser.</p>
      <div class="bar"><button id="copyLua">Copy settings file</button><button id="copyJson">Copy JSON</button><button id="reset">Reset to the file's settings</button></div>
      <textarea id="exportLua" rows="10" readonly style="margin-top:8px"></textarea>
      <h3>Load settings (JSON)</h3>
      <textarea id="importJson" rows="3" placeholder="Paste JSON copied from this page"></textarea>
      <div class="bar" style="margin-top:6px"><button id="loadJson">Load</button></div>
    </section>
  </div>

  <div id="editor"></div>
</main>

<script id="src-wasmoon" type="text/plain">{{WASMOON}}</script>
<script id="src-wasm" type="text/plain">{{WASM_B64}}</script>
{{LUA_FILES}}

<script id="src-host" type="text/plain">
// runs in a worker (or on the page if workers are blocked): the siren's Lua, rendering tones
function SirenHost(post, wasmoonLib) {
  let L = null, res = null, buf = null
  function lua(v) {
    if (v === null || v === undefined) return 'nil'
    if (typeof v === 'number') return Number.isFinite(v) ? String(v) : '0'
    if (typeof v === 'boolean') return v ? 'true' : 'false'
    if (typeof v === 'string') return JSON.stringify(v)
    if (Array.isArray(v)) return '{' + v.map(lua).join(',') + '}'
    return '{' + Object.keys(v).filter((k) => v[k] !== undefined && v[k] !== null)
      .map((k) => '[' + JSON.stringify(k) + ']=' + lua(v[k])).join(',') + '}'
  }
  async function init(files, wasm) {
    globalThis.__WASMOON_BINARY = new Uint8Array(wasm)
    L = await new wasmoonLib.LuaFactory().createEngine()
    L.global.set('__result', (s) => { res = s })
    L.global.set('__push', (...xs) => { for (let i = 0; i < xs.length; i++) buf.push(xs[i]) })
    for (const f of files) {
      try { await L.doString(f.src) } catch (e) { throw new Error(f.name + ': ' + e.message) }
    }
    res = null
    await L.doString('STUDIO.defaults()')
    post({ type: 'ready', defaults: JSON.parse(res) })
  }
  async function render(m) {
    buf = []
    res = null
    const t0 = Date.now()
    await L.doString('STUDIO.render(' + lua(m.tone) + ',' + lua(m.cfg) + ',' + (m.inside ? 'true' : 'false') + ')')
    const data = Float32Array.from(buf)
    buf = null
    post({ type: 'rendered', id: m.id, key: m.key, sr: res, data, ms: Date.now() - t0 }, [data.buffer])
  }
  let queue = Promise.resolve()
  return (m) => {
    queue = queue.then(() => (m.type === 'init' ? init(m.files, m.wasm) : render(m)))
      .catch((e) => post({ type: 'error', text: String((e && e.message) || e) }))
  }
}
</script>

<script>
const CONFIG_HEADER = {{CONFIG_HEADER}}
const $ = (id) => document.getElementById(id)
const el = (tag, props, ...kids) => {
  const e = document.createElement(tag)
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v)
    else if (k in e) e[k] = v
    else e.setAttribute(k, v)
  }
  for (const k of kids) if (k !== null && k !== undefined) e.append(k)
  return e
}
const clone = (x) => JSON.parse(JSON.stringify(x))
const STORE = 'siren_studio_settings_v2'   // (v2: horn removed, softer tones: older saves are left behind)

let DEFAULTS = null, CFG = null, SEL = null

function status(t, cls) { $('status').textContent = t; $('status').className = cls || '' }

// ---------------------------------------------------------------------------------------------
// settings: the shape the Lua file has, filled in where an old save or an import lacks a field
// ---------------------------------------------------------------------------------------------
const TONE_SHAPE = {
  name: 'Tone', level: 1, pattern: [{ f: 800, glide: 0, hold: 0.5, curve: 1 }], logGlide: true,
  harmonics: [1, 0, 0.33, 0, 0.2, 0, 0.14, 0, 0.11],
  voice2: { on: false, semitones: 0, cents: 6, level: 0.6, offset: 0 },
  vibrato: { rate: 0, depth: 0 }, tremolo: { rate: 0, depth: 0 },
  speaker: { highpass: 400, lowpass: 5500, drive: 1.5, resonance: 1100, resonanceQ: 1.4, resonanceGain: 5 },
}
function fill(obj, shape) {
  for (const [k, v] of Object.entries(shape)) {
    if (obj[k] === undefined || obj[k] === null) obj[k] = clone(v)
    else if (v && typeof v === 'object' && !Array.isArray(v)) fill(obj[k], v)
  }
  return obj
}
function normalize(c) {
  const d = DEFAULTS
  if (!c.soundLevels || typeof c.soundLevels !== 'object' || Array.isArray(c.soundLevels)) c.soundLevels = clone(d.soundLevels || {})
  for (const k of ['volume', 'soundLevel', 'doppler', 'attack', 'release', 'stopPitch', 'pitch', 'sampleRate']) if (c[k] === undefined) c[k] = d[k]
  c.cabin = Object.assign(clone(d.cabin || { volume: 0.35, muffle: 1400 }), c.cabin || {})
  delete c.horn
  if (!Array.isArray(c.lightTones)) c.lightTones = clone(d.lightTones)
  while (c.lightTones.length < 2) c.lightTones.push('')
  if (!Array.isArray(c.cycle)) c.cycle = []
  // the fire / medical tone sets (edited in the file: the page plays the police rules); an older save
  // gets the file's sets and the tones they name
  if (!c.schemes || typeof c.schemes !== 'object' || Array.isArray(c.schemes)) c.schemes = clone(d.schemes || {})
  if (!c.tones || typeof c.tones !== 'object' || Array.isArray(c.tones)) c.tones = {}
  for (const sc of Object.values(c.schemes)) {
    if (!Array.isArray(sc.lightTones)) sc.lightTones = []
    while (sc.lightTones.length < 2) sc.lightTones.push('')
    if (!Array.isArray(sc.cycle)) sc.cycle = []
    for (const id of [...sc.lightTones, ...sc.cycle]) if (id && !c.tones[id] && d.tones && d.tones[id]) c.tones[id] = clone(d.tones[id])
  }
  c.keys = { tone: (c.keys && c.keys.tone) || (d.keys && d.keys.tone) || 'q' }
  // Lua doesn't keep the file's order: the cycle's tones first, then the rest
  const order = [...c.cycle, ...Object.keys(c.tones)].filter((id, i, a) => c.tones[id] && a.indexOf(id) === i)
  c.tones = Object.fromEntries(order.map((id) => [id, c.tones[id]]))
  for (const t of Object.values(c.tones)) {
    fill(t, TONE_SHAPE)
    for (const p of t.pattern) { p.glide = p.glide || 0; p.hold = p.hold || 0; p.curve = p.curve || 1 }
  }
  return c
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(CFG)) } catch (e) { } }

// ---------------------------------------------------------------------------------------------
// the Lua side
// ---------------------------------------------------------------------------------------------
let host = null
function startHost() {
  const libSrc = $('src-wasmoon').textContent, hostSrc = $('src-host').textContent
  const bin = Uint8Array.from(atob($('src-wasm').textContent.trim()), (c) => c.charCodeAt(0))
  const files = [...document.querySelectorAll('script[type="text/x-lua"]')].map((s) => ({ name: s.dataset.name, src: s.textContent }))
  const boot = '\nconst __h = SirenHost((m, t) => postMessage(m, t || []), self.wasmoon)\nonmessage = (e) => __h(e.data)\n'
  try {
    const w = new Worker(URL.createObjectURL(new Blob([libSrc, '\n', hostSrc, boot], { type: 'text/javascript' })))
    w.onmessage = (e) => onHost(e.data)
    w.onerror = (e) => status('Worker error: ' + e.message, 'err')
    host = (m, t) => w.postMessage(m, t || [])
  } catch (e) {
    // workers blocked (some browsers on file://): run on the page, it just pauses while rendering
    ;(0, eval)(libSrc + '\n' + hostSrc + '\nwindow.SirenHost = SirenHost')
    const h = window.SirenHost((m) => setTimeout(() => onHost(m)), window.wasmoon)
    host = (m) => setTimeout(() => h(m))
  }
  host({ type: 'init', files, wasm: bin.buffer }, [bin.buffer])
}

const rendered = {}   // id -> { key, data, sr, buffer }
const asked = {}      // id -> key last sent
let inside = false
function renderKey(id) { return JSON.stringify([CFG.tones[id], CFG.pitch, CFG.sampleRate, inside && CFG.cabin.muffle]) }
function requestRender(id) {
  if (!CFG.tones[id]) return
  const key = renderKey(id)
  if ((rendered[id] && rendered[id].key === key) || asked[id] === key) return
  asked[id] = key
  host({ type: 'render', id, key, inside, tone: CFG.tones[id], cfg: { pitch: CFG.pitch, sampleRate: CFG.sampleRate, cabin: CFG.cabin } })
}
let renderTimer = null
function scheduleRender(ids) {
  clearTimeout(renderTimer)
  renderTimer = setTimeout(() => { for (const id of ids) requestRender(id) }, 150)
}

function onHost(m) {
  if (m.type === 'error') { status('Lua error: ' + m.text, 'err'); return }
  if (m.type === 'ready') {
    DEFAULTS = m.defaults
    let saved = null
    try { saved = JSON.parse(localStorage.getItem(STORE) || 'null') } catch (e) { }
    CFG = normalize(saved || clone(DEFAULTS))
    SEL = Object.keys(CFG.tones)[0] || null
    status(saved ? 'Ready (your saved edits)' : 'Ready')
    refreshAll()
    if (SEL) requestRender(SEL)
    for (const id of Object.keys(CFG.tones)) requestRender(id)
    return
  }
  if (m.type === 'rendered') {
    if (!CFG.tones[m.id] || renderKey(m.id) !== m.key) return
    rendered[m.id] = { key: m.key, data: m.data, sr: m.sr, buffer: null }
    if (m.id === SEL) status(`${CFG.tones[m.id].name}: ${(m.data.length / m.sr).toFixed(2)} s loop, rendered in ${m.ms} ms`)
    onRendered(m.id)
  }
}

// ---------------------------------------------------------------------------------------------
// playback: one tone at a time, faded in and out the way the game does it
// ---------------------------------------------------------------------------------------------
let ctx = null, master = null
let voice = null        // { id, src, gain, start, dur } or { id, waiting: true }
let mode = null         // 'preview' | 'sim' | null
const sim = { lights: 0, tone: '', at: -1 }

function audio() {
  if (!ctx) {
    ctx = new AudioContext()
    master = ctx.createGain()
    master.gain.value = +$('monitor').value
    master.connect(ctx.destination)
  }
  if (ctx.state === 'suspended') ctx.resume()
  return ctx
}
function bufferOf(id) {
  const r = rendered[id]
  if (!r) return null
  if (!r.buffer) {
    r.buffer = ctx.createBuffer(1, r.data.length, r.sr)
    r.buffer.copyToChannel(r.data, 0)
  }
  return r.buffer
}
function levelOf(id) { const t = CFG.tones[id]; return CFG.volume * (t ? t.level : 1) * (inside ? CFG.cabin.volume : 1) }

function startVoice(id, fade, offsetShare) {
  const buf = bufferOf(id)
  if (!buf) { requestRender(id); return { id, waiting: true } }
  const now = ctx.currentTime
  const src = ctx.createBufferSource()
  src.buffer = buf
  src.loop = true
  const gain = ctx.createGain()
  gain.gain.setValueAtTime(0, now)
  gain.gain.linearRampToValueAtTime(levelOf(id), now + Math.max(fade, 0.005))
  src.connect(gain).connect(master)
  const offset = (offsetShare || 0) * buf.duration
  src.start(now, offset)
  return { id, src, gain, start: now - offset, dur: buf.duration }
}
function stopVoice(v, fade, pitchTo) {
  if (!v || v.waiting) return
  const now = ctx.currentTime
  v.gain.gain.cancelScheduledValues(now)
  v.gain.gain.setValueAtTime(v.gain.gain.value, now)
  v.gain.gain.linearRampToValueAtTime(0, now + Math.max(fade, 0.005))
  if (pitchTo < 1) v.src.playbackRate.linearRampToValueAtTime(pitchTo, now + Math.max(fade, 0.005))
  v.src.stop(now + fade + 0.05)
}
function sound(id) {
  if ((voice ? voice.id : null) === (id || null)) return
  if (id || voice) audio()
  stopVoice(voice, CFG.release, CFG.stopPitch)
  voice = id ? startVoice(id, CFG.attack) : null
  showSounding()
}
// a tone re-rendered while it plays: swapped in at the same point of its loop
function onRendered(id) {
  if (!voice || voice.id !== id || !ctx) return
  if (voice.waiting) { voice = startVoice(id, CFG.attack); showSounding(); return }
  const share = (((ctx.currentTime - voice.start) % voice.dur) + voice.dur) % voice.dur / voice.dur
  stopVoice(voice, 0.03, 1)
  voice = startVoice(id, 0.03, share)
}
function retargetLevel() {
  if (voice && !voice.waiting) voice.gain.gain.setTargetAtTime(levelOf(voice.id), ctx.currentTime, 0.02)
}
function showSounding() {
  $('sounding').textContent = voice ? (CFG.tones[voice.id] ? CFG.tones[voice.id].name : voice.id) + (voice.waiting ? ' (rendering)' : '') : 'silent'
}

// the in-game rules (lua/police_siren/sh_siren.lua)
function chosenTone() {
  if (!sim.lights) return ''
  if (sim.at === sim.lights) return sim.tone
  return CFG.lightTones[sim.lights - 1] || ''
}
function soundingTone() {
  const id = chosenTone()
  return id && CFG.tones[id] ? id : null
}
function nextTone(id) {
  const c = CFG.cycle
  const i = c.indexOf(id)
  if (i >= 0) return c[i + 1] || ''
  return c[0] || ''
}
function simUpdate() {
  mode = 'sim'
  const names = ['off', 'CODE 2', 'CODE 3']
  $('simLights').textContent = 'Lights: ' + names[sim.lights]
  $('lightDots').className = 'lights' + (sim.lights ? ' c' + (sim.lights + 1) : '')
  sound(soundingTone())
}
function simLights() { sim.lights = (sim.lights + 1) % 3; simUpdate() }
function simTone() {
  if (!sim.lights) { status('The tone key works with the lights on'); return }
  sim.tone = nextTone(chosenTone())
  sim.at = sim.lights
  simUpdate()
}

$('play').onclick = () => { if (!SEL) return; mode = 'preview'; sound(null); sound(SEL) }
$('stop').onclick = () => { mode = null; sim.lights = 0; sim.at = -1; $('simLights').textContent = 'Lights: off'; $('lightDots').className = 'lights'; sound(null) }
// a pass-by: the playing tone (or the CODE 3 one) as a car drives past 4 m away, with the game's Doppler
let passTimer = null
function passEnd() {
  clearInterval(passTimer)
  passTimer = null
  if (!ctx) return
  master.gain.setTargetAtTime(+$('monitor').value, ctx.currentTime, 0.05)
  if (voice && voice.src) voice.src.playbackRate.setTargetAtTime(1, ctx.currentTime, 0.05)
}
$('passBy').onclick = () => {
  if ($('inside').checked) { $('inside').checked = false; $('inside').onchange() }
  if (!voice) {
    if (CFG.lightTones[1]) { sim.lights = 2; sim.at = -1; simUpdate() } else if (SEL) { mode = 'preview'; sound(SEL) }
  }
  const v = Math.max(+$('passSpeed').value || 80, 1) / 3.6, C = 343, side = 4, half = 60
  const t0 = performance.now()
  clearInterval(passTimer)
  passTimer = setInterval(() => {
    const x = -half + v * (performance.now() - t0) / 1000
    if (x > half) { passEnd(); return }
    const d = Math.hypot(x, side)
    let ratio = C / Math.max(C - v * (-x / d), 1)
    ratio = 1 + (ratio - 1) * CFG.doppler
    ratio = Math.min(Math.max(Math.round(200 * ratio), 150), 255) / 200   // as in game: half-percent steps, at most +4 semitones
    if (voice && voice.src) voice.src.playbackRate.setTargetAtTime(ratio, ctx.currentTime, 0.02)
    master.gain.setTargetAtTime(+$('monitor').value * Math.min(1, 6 / d), ctx.currentTime, 0.03)
  }, 30)
}
$('inside').onchange = () => {

function fmt(v, step) {
  const d = step >= 1 ? 0 : Math.min(4, Math.ceil(-Math.log10(step)))
  return (+v).toFixed(d)
}
// a slider + number box bound to obj[key]; o: { min, max, step, log, unit, change }
function field(label, obj, key, o) {
  const toSlider = (v) => o.log ? Math.log(v / o.min) / Math.log(o.max / o.min) * 1000 : v
  const fromSlider = (s) => o.log ? o.min * Math.pow(o.max / o.min, s / 1000) : s
  const range = el('input', { type: 'range', min: o.log ? 0 : o.min, max: o.log ? 1000 : o.max, step: o.log ? 1 : o.step, value: toSlider(obj[key]) })
  const num = el('input', { type: 'number', min: o.min, max: o.max, step: o.step, value: fmt(obj[key], o.step) })
  range.oninput = () => {
    let v = +fromSlider(+range.value)
    v = Math.round(v / o.step) * o.step
    obj[key] = +fmt(v, o.step)
    num.value = fmt(obj[key], o.step)
    o.change()
  }
  num.oninput = () => {
    const v = parseFloat(num.value)
    if (!Number.isFinite(v)) return
    obj[key] = v
    range.value = toSlider(Math.min(Math.max(v, o.min), o.max))
    o.change()
  }
  return el('div', { class: 'row' }, el('label', null, label), range, num, el('span', { class: 'unit' }, o.unit || ''))
}
function check(label, obj, key, change) {
  const c = el('input', { type: 'checkbox', checked: !!obj[key], onchange: () => { obj[key] = c.checked; change() } })
  return el('div', { class: 'row' }, el('label', null, label), c)
}
function toneSelect(label, get, set, allowNone) {
  const s = el('select', { onchange: () => { set(s.value); onGlobal() } })

  s.value = get()
  return el('div', { class: 'row' }, el('label', null, label), s)
}

const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B']

  if (!(f > 0)) return ''
  const m = 69 + 12 * Math.log2(f / 440)

  return NOTES[((r % 12) + 12) % 12] + (Math.floor(r / 12) - 1) + (cents ? (cents > 0 ? ' +' : ' ') + cents + '¢' : '')
}

const HARMONIC_PRESETS = {

  Triangle: () => Array.from({ length: 16 }, (_, i) => ((i + 1) % 2 ? +(1 / ((i + 1) * (i + 1))).toFixed(3) : 0)),
  'Siren (soft)': () => [1, 0.03, 0.2, 0.02, 0.09, 0.01, 0.04, 0, 0.02],
  'Siren (bright)': () => [1, 0.05, 0.33, 0.04, 0.2, 0.03, 0.14, 0.02, 0.11, 0, 0.09, 0, 0.07],
}

function buildPoints() {
  const t = CFG.tones[SEL]
  const box = $('points')
  if (!box) return
  const n = t.pattern.length
  const rows = t.pattern.map((p, i) => {
    const prev = t.pattern[(i - 1 + n) % n]
    const iv = n > 1 && prev.f > 0 && p.f > 0 ? 12 * Math.log2(p.f / prev.f) : 0
    const num = (key, step, min, after) => el('input', { type: 'number', step, min, value: p[key], onchange: (e) => {
      const v = parseFloat(e.target.value)
      if (!Number.isFinite(v)) return

      if (after) after()
      buildPoints(); onTone()
    } })

      const v = parseFloat(e.target.value)

      p.f = +(prev.f * Math.pow(2, v / 12)).toFixed(2)
      buildPoints(); onTone()
    } })
    return el('tr', null,

// the pitch pattern drawn over one loop (the same timing the synth uses), with draggable points
const F_MIN = 60, F_MAX = 5000
let cv = null, drag = null
function segments(t) {
  const segs = [], pts = []
  let time = 0
  const n = t.pattern.length
  t.pattern.forEach((p, i) => {
    const prev = t.pattern[(i - 1 + n) % n]
    const start = time
    if (p.glide > 0) { segs.push({ t0: time, t1: time + p.glide, f0: prev.f, f1: p.f, curve: p.curve }); time += p.glide }
    pts.push({ i, t: time, start, f: p.f })
    if (p.hold > 0) { segs.push({ t0: time, t1: time + p.hold, f0: p.f, f1: p.f, curve: 1 }); time += p.hold }
  })
  return { segs, pts, T: Math.max(time, 0.05) }
}
function freqAt(segs, time, logGlide) {
  const s = segs.find((x) => time < x.t1) || segs[segs.length - 1]
  if (!s) return 0
  if (s.f0 === s.f1) return s.f0
  const u = Math.pow(Math.min(Math.max((time - s.t0) / (s.t1 - s.t0), 0), 1), Math.max(s.curve, 0.05))
  return logGlide && s.f0 > 0 && s.f1 > 0 ? s.f0 * Math.pow(s.f1 / s.f0, u) : s.f0 + (s.f1 - s.f0) * u
}
function setupCanvas() {
  cv = $('pattern')
  const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top } }
  cv.onmousedown = (e) => {
    const t = CFG.tones[SEL], g = geom(), m = pos(e)
    const { pts, T } = segments(t)
    let best = null, bd = 12
    for (const p of pts) {
      const d = Math.hypot(g.x(p.t, T) - m.x, g.y(p.f) - m.y)
      if (d < bd) { bd = d; best = p }
    }
    if (best) drag = { i: best.i, start: best.start, T }
  }
  window.onmousemove = (e) => {
    if (!drag || !cv) return
    const t = CFG.tones[SEL], g = geom(), m = pos(e)
    const p = t.pattern[drag.i]
    let f = g.fy(m.y)
    if (snap) f = snapSemitone(f)
    p.f = +f.toFixed(2)
    p.glide = +Math.max(0, g.tx(m.x, drag.T) - drag.start).toFixed(3)
    drawPattern(drag.T)
    buildPoints()
    onTone()
  }
  window.onmouseup = () => { if (drag) { drag = null; drawPattern() } }
}
function geom() {
  const w = cv.clientWidth, h = cv.clientHeight, L = 46, R = 12, Tp = 10, B = 22
  const lf = (f) => Math.log(f / F_MIN) / Math.log(F_MAX / F_MIN)
  return {
    w, h, L, R, Tp, B,
    x: (time, T) => L + (time / T) * (w - L - R),
    tx: (x, T) => Math.min(Math.max((x - L) / (w - L - R), 0), 1) * T,
    y: (f) => Tp + (1 - lf(Math.min(Math.max(f, F_MIN), F_MAX))) * (h - Tp - B),
    fy: (y) => F_MIN * Math.pow(F_MAX / F_MIN, 1 - Math.min(Math.max((y - Tp) / (h - Tp - B), 0), 1)),
  }
}
function drawPattern(fixedT) {
  if (!cv || !SEL || !document.body.contains(cv)) return
  const t = CFG.tones[SEL]
  const dpr = window.devicePixelRatio || 1
  cv.width = cv.clientWidth * dpr
  cv.height = cv.clientHeight * dpr
  const c = cv.getContext('2d')
  c.setTransform(dpr, 0, 0, dpr, 0, 0)
  const g = geom()
  const { segs, pts, T: T0 } = segments(t)
  const T = fixedT || T0
  c.clearRect(0, 0, g.w, g.h)
  c.font = '11px system-ui'
  c.fillStyle = '#8d99a6'
  c.strokeStyle = '#2f3843'
  for (const f of [100, 200, 400, 800, 1600, 3200]) {
    const y = g.y(f)
    c.beginPath(); c.moveTo(g.L, y); c.lineTo(g.w - g.R, y); c.stroke()
    c.fillText(f >= 1000 ? f / 1000 + 'k' : String(f), 8, y + 4)
  }
  const steps = Math.max(1, Math.round(T / 0.5))
  for (let k = 0; k <= steps; k++) {
    const time = (k / steps) * T, x = g.x(time, T)
    c.fillText(time.toFixed(2) + 's', Math.min(x, g.w - 40), g.h - 6)
  }
  const line = (mul, shift, color, dash) => {
    c.strokeStyle = color; c.lineWidth = 2; c.setLineDash(dash || []); c.beginPath()
    const N = 600
    for (let k = 0; k <= N; k++) {
      const time = (k / N) * T0
      const f = freqAt(segs, ((time + shift * T0) % T0 + T0) % T0, t.logGlide) * mul * CFG.pitch
      const x = g.x(time, T), y = g.y(f)
      k ? c.lineTo(x, y) : c.moveTo(x, y)
    }
    c.stroke(); c.setLineDash([])
  }
  if (t.voice2.on) line(Math.pow(2, (t.voice2.semitones + t.voice2.cents / 100) / 12), t.voice2.offset, '#ffb03a', [5, 4])
  line(1, 0, '#4ea1ff')
  for (const p of pts) {
    const x = g.x(p.t, T), y = g.y(p.f * CFG.pitch)
    c.fillStyle = drag && drag.i === p.i ? '#fff' : '#4ea1ff'
    c.beginPath(); c.arc(x, y, 6, 0, Math.PI * 2); c.fill()
    c.fillStyle = '#e6eaef'
    c.fillText(String(p.i + 1), x + 8, y - 8)
  }
  if (voice && !voice.waiting && voice.id === SEL && ctx) {
    const share = (((ctx.currentTime - voice.start) % voice.dur) + voice.dur) % voice.dur / voice.dur
    const x = g.x(share * T0, T)
    c.strokeStyle = '#4cd18a'; c.lineWidth = 1
    c.beginPath(); c.moveTo(x, g.Tp); c.lineTo(x, g.h - g.B); c.stroke()
  }
}
;(function tick() { if (voice && voice.id === SEL && !drag) drawPattern(); requestAnimationFrame(tick) })()
window.addEventListener('resize', () => drawPattern())

// ---------------------------------------------------------------------------------------------
// export: the settings file, written the way the Lua file is
// ---------------------------------------------------------------------------------------------
const GLOBAL_ORDER = ['volume', 'soundLevel', 'soundLevels', 'doppler', 'attack', 'release', 'stopPitch', 'pitch', 'sampleRate', 'lightTones', 'cycle', 'schemes', 'cabin', 'keys', 'tones']
const TONE_ORDER = ['name', 'level', 'pattern', 'logGlide', 'harmonics', 'voice2', 'vibrato', 'tremolo', 'speaker']
const SUB_ORDER = {
  pattern: ['f', 'glide', 'hold', 'curve'], voice2: ['on', 'semitones', 'cents', 'level', 'offset'], vibrato: ['rate', 'depth'],
  tremolo: ['rate', 'depth'], speaker: ['highpass', 'lowpass', 'drive', 'resonance', 'resonanceQ', 'resonanceGain'], keys: ['tone'],
  cabin: ['volume', 'muffle'],
}
const luaKey = (k) => (/^[A-Za-z_][A-Za-z0-9_]*$/.test(k) ? k : '[' + JSON.stringify(k) + ']')
function luaNum(v) { return String(+(+v).toFixed(4)) }
function luaScalar(v) {
  if (typeof v === 'number') return luaNum(v)
  if (typeof v === 'boolean') return String(v)
  return JSON.stringify(String(v))
}
function luaInline(obj, order) {
  const keys = order ? order.filter((k) => k in obj) : Object.keys(obj)
  return '{ ' + keys.map((k) => luaKey(k) + ' = ' + luaScalar(obj[k])).join(', ') + ' }'
}
function exportLua() {
  const tab = (n) => '\t'.repeat(n)
  const out = ['POLICE_SIREN.CONFIG = {']
  for (const k of GLOBAL_ORDER) {
    const v = CFG[k]
    if (k === 'tones') {
      out.push(tab(1) + 'tones = {')
      for (const [id, t] of Object.entries(CFG.tones)) {
        out.push(tab(2) + luaKey(id) + ' = {')
        for (const tk of TONE_ORDER) {
          const tv = t[tk]
          if (tk === 'pattern') {
            out.push(tab(3) + 'pattern = {')
            for (const p of tv) out.push(tab(4) + luaInline(p, SUB_ORDER.pattern) + ',')
            out.push(tab(3) + '},')
          } else if (tk === 'harmonics') {
            let h = tv.slice()
            while (h.length > 1 && !h[h.length - 1]) h.pop()
            out.push(tab(3) + 'harmonics = { ' + h.map(luaNum).join(', ') + ' },')
          } else if (tv && typeof tv === 'object') {
            out.push(tab(3) + tk + ' = ' + luaInline(tv, SUB_ORDER[tk]) + ',')
          } else {
            out.push(tab(3) + tk + ' = ' + luaScalar(tv) + ',')
          }
        }
        out.push(tab(2) + '},')
      }
      out.push(tab(1) + '},')
    } else if (k === 'schemes') {
      out.push(tab(1) + 'schemes = {')
      for (const [name, sc] of Object.entries(v)) {
        const list = (a) => '{ ' + a.map(luaScalar).join(', ') + ' }'
        out.push(tab(2) + luaKey(name) + ' = { lightTones = ' + list(sc.lightTones) + ', cycle = ' + list(sc.cycle) + ' },')
      }
      out.push(tab(1) + '},')
    } else if (k === 'soundLevels') {
      const models = Object.keys(v).sort()
      if (!models.length) { out.push(tab(1) + 'soundLevels = {},'); continue }
      out.push(tab(1) + 'soundLevels = {')
      for (const m of models) out.push(tab(2) + luaKey(m) + ' = ' + luaNum(v[m]) + ',')
      out.push(tab(1) + '},')
    } else if (Array.isArray(v)) {
      out.push(tab(1) + k + ' = { ' + v.map(luaScalar).join(', ') + ' },')
    } else if (v && typeof v === 'object') {
      out.push(tab(1) + k + ' = ' + luaInline(v, SUB_ORDER[k]) + ',')
    } else {
      out.push(tab(1) + k + ' = ' + luaScalar(v) + ',')
    }
  }
  out.push('}')
  return CONFIG_HEADER + out.join('\n') + '\n'
}
function updateExport() { if (CFG) $('exportLua').value = exportLua() }
async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); status(what + ' copied') } catch (e) {
    $('exportLua').value = text; $('exportLua').select(); document.execCommand('copy'); status(what + ' copied')
  }
}
$('copyLua').onclick = () => copy(exportLua(), 'Settings file')
$('copyJson').onclick = () => copy(JSON.stringify(CFG), 'JSON')
$('reset').onclick = () => {
  if (!DEFAULTS) return
  CFG = normalize(clone(DEFAULTS))
  save()
  SEL = Object.keys(CFG.tones)[0]
  sound(null)
  refreshAll()
  for (const id of Object.keys(CFG.tones)) requestRender(id)
  status("Back to the file's settings")
}
$('loadJson').onclick = () => {
  try {
    CFG = normalize(JSON.parse($('importJson').value))
    save()
    SEL = Object.keys(CFG.tones)[0]
    sound(null)
    refreshAll()
    for (const id of Object.keys(CFG.tones)) requestRender(id)
    status('Loaded')
  } catch (e) { status('Not valid JSON: ' + e.message, 'err') }
}

startHost()

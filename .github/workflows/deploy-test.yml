# Every push to main goes to the test server (BisectHosting, SFTP): the files it changed are
# uploaded, the ones it removed deleted (.github/scripts/deploy_test.sh). "Run workflow" on the
# Actions tab uploads everything.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   TEST_SFTP_USER      the panel's SFTP username
#   TEST_SFTP_PASSWORD  the panel password
name: Deploy to the test server

on:
  push:
    branches: [main]
  workflow_dispatch:

# (one deploy at a time, in order: a later one never runs under an earlier one)
concurrency:
  group: deploy-test-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload
        env:
          SFTP_HOST: gamesfra1178.bisecthosting.com
          SFTP_PORT: "2022"
          # (the server's key, pinned: nothing is sent to anything else answering at that address)
          SFTP_HOST_KEY: "[gamesfra1178.bisecthosting.com]:2022 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGIRJ1jov2XU9+2knfrsLgHUoB/dXwl7VOqxm9077LCO"
          SFTP_USER: ${{ secrets.TEST_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.TEST_SFTP_PASSWORD }}
          ADDON_DIR: /garrysmod/addons/cool_engine_sounds_perpcars
          SL65_DIR: /garrysmod/addons/sl65amg_rtu
          # (empty on a manual run: everything is uploaded)
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          AFTER: ${{ github.sha }}
        run: bash .github/scripts/deploy_test.sh
